# EXRouter Configuration with Multiple Locking Domains
#
# Architecture:
# - Each top-level key under "backends:" is a LOCKING DOMAIN
# - Backends within a domain can only lock other backends in the SAME domain
# - Cross-domain requests don't cause deadlocks
#
# Example deadlock problem this solves:
#   open_webui (frontend) locks hermes_webui (frontend)
#   hermes_webui calls llm (compute) through exrouter
#   llm wants to lock stt (compute)
#   Without domains: hermes_webui → llm → stt → deadlock
#   With domains: frontend and compute are independent → no deadlock

server:
  host: 0.0.0.0
  port: 4001

# Define locking domains
backends:
  # Domain 1: Compute backends (LLM, STT, embeddings, etc.)
  compute:
    llm:
      url: http://localhost:8080
      remapper: /src/exrouter/samples/llm-responses-remapper.py
      paths:
        - /v1/chat/completions
        - /v1/completions
        - /v1/models
        - /v1/models/*
      # Lock other backends in the "compute" domain
      locks:
        - vision
        - embed
    
    vision:
      url: http://localhost:8081
      paths:
        - /v1/vision/*
      locks: []
    
    embed:
      url: http://localhost:8082
      paths:
        - /v1/embeddings
      # Can lock llm (same domain)
      locks:
        - llm
    
    stt:
      url: http://localhost:7301
      paths:
        - /transcribe
      locks: []

  # Domain 2: Frontend tier (web UIs, dashboards)
  frontend:
    open_webui:
      url: http://localhost:9090
      paths:
        - /
      domain:
        - webui.example.com
      # Lock other backends in the "frontend" domain
      locks:
        - hermes_webui
    
    hermes_webui:
      url: http://localhost:9100
      paths:
        - /
      domain:
        - hermes.example.com
      # Can lock open_webui (same domain)
      # When hermes_webui calls llm (compute domain), no deadlock!
      locks:
        - open_webui

  # Domain 3: Audio processing (TTS, audio backends)
  audio:
    tts:
      url: http://localhost:7302
      paths:
        - /tts
      locks: []
    
    audio_processor:
      url: http://localhost:7303
      paths:
        - /audio/*
      locks:
        - tts

# Global lock settings
global_lock:
  enabled: true
  timeout: 300
